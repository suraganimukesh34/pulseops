<mat-toolbar class="navbar">

    <div class="page-title">

        <h1>{{ pageHeader.title() }}</h1>

        <span>{{ pageHeader.subtitle() }}</span>

    </div>


    <div class="navbar-right">

        <button type="button" class="search-box" (click)="openPalette()">

            <mat-icon>search</mat-icon>

            <span class="search-placeholder">Jump to a page...</span>

            <span class="kbd-hint">Ctrl K</span>

        </button>

        <button mat-icon-button class="icon-btn theme-btn" [matTooltip]="themeLabel" [attr.aria-label]="themeLabel"
            (click)="cycleTheme()">
            <mat-icon>{{ themeIcon }}</mat-icon>
        </button>

        <button mat-icon-button class="icon-btn" [matMenuTriggerFor]="alertsMenu"
            [matBadge]="unacknowledgedAlerts.length > 0 ? unacknowledgedAlerts.length : null" matBadgeColor="warn"
            matBadgeSize="small">
            <mat-icon>notifications</mat-icon>
        </button>

        <mat-menu #alertsMenu="matMenu">
            @if (unacknowledgedAlerts.length === 0) {
            <button mat-menu-item disabled>No active alerts</button>
            } @else {
            @for (alert of unacknowledgedAlerts.slice(0, 5); track alert.id) {
            <button mat-menu-item disabled>{{ alert.message }}</button>
            }
            }
        </mat-menu>

        <button mat-icon-button class="icon-btn account-btn" [matMenuTriggerFor]="accountMenu">
            <mat-icon>account_circle</mat-icon>
        </button>

        <mat-menu #accountMenu="matMenu">
            <div class="account-info">
                <strong>{{ currentUser.user()?.name || 'User' }}</strong>
                <span>{{ currentUser.user()?.role }}</span>
            </div>
            <button mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Logout</span>
            </button>
        </mat-menu>

    </div>

</mat-toolbar>
