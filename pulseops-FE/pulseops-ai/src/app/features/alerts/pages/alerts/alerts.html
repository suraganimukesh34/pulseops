<div class="list-page">
    <div class="summary-grid">

        <app-stat-card icon="notifications_active" title="Active Alerts" [value]="activeCount.toString()"
            subtitle="Awaiting acknowledgement" color="var(--danger)">
        </app-stat-card>

        <app-stat-card icon="report" title="Critical" [value]="criticalCount.toString()"
            subtitle="Unacknowledged critical alerts" color="var(--danger)">
        </app-stat-card>

        <app-stat-card icon="check_circle" title="Acknowledged" [value]="acknowledgedCount.toString()"
            subtitle="Resolved or noted" color="var(--success)">
        </app-stat-card>

    </div>

    <div class="list-table">

        <div class="table-header">
            <div>
                <h2>Alerts</h2>
                <span>{{ alerts.length }} Alerts</span>
            </div>

            <button class="add-btn" type="button" (click)="openAddAlertDialog()">
                + Add Alert
            </button>
        </div>

        <div class="table-scroll">
        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="severity">
                <th mat-header-cell *matHeaderCellDef>Severity</th>
                <td mat-cell *matCellDef="let alert">
                    <span class="badge" [ngClass]="badgeClass(alert.severity)">{{ alert.severity }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="category">
                <th mat-header-cell *matHeaderCellDef>Category</th>
                <td mat-cell *matCellDef="let alert">{{ alert.category }}</td>
            </ng-container>

            <ng-container matColumnDef="message">
                <th mat-header-cell *matHeaderCellDef>Message</th>
                <td mat-cell *matCellDef="let alert">{{ alert.message }}</td>
            </ng-container>

            <ng-container matColumnDef="source">
                <th mat-header-cell *matHeaderCellDef>Source</th>
                <td mat-cell *matCellDef="let alert">{{ alert.source }}</td>
            </ng-container>

            <ng-container matColumnDef="timestamp">
                <th mat-header-cell *matHeaderCellDef>Timestamp</th>
                <td mat-cell *matCellDef="let alert">{{ formatTimestamp(alert.timestamp) }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let alert">
                    <div class="row-actions">
                        <div class="action-slot">
                        @if (!alert.acknowledged) {
                        <button type="button" class="row-action-btn primary" (click)="acknowledge(alert)">
                            Acknowledge
                        </button>
                        } @else {
                        <span class="status-note">Acknowledged</span>
                        }
                        </div>
                        <button type="button" class="icon-action-btn" aria-label="Edit alert"
                            (click)="openEditAlertDialog(alert)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button type="button" class="icon-action-btn danger" aria-label="Delete alert"
                            (click)="deleteAlert(alert)">
                            <mat-icon>delete_outline</mat-icon>
                        </button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>
        </div>

    </div>
</div>
