<div class="dashboard-container">

    <div class="kpi-grid">
        <app-kpi-card *ngFor="let card of kpis" [card]=card></app-kpi-card>

    </div>

    <div class="widgets-grid">
        <app-hospital-status [summary]="summary"></app-hospital-status>
        <app-bed-occupancy [summary]="summary"></app-bed-occupancy>
        <app-active-alerts [alerts]="recentAlerts"></app-active-alerts>
        <app-department-load [departmentLoad]="summary?.department_load ?? []"></app-department-load>

    </div>
    <div class="ai-widget">
        <app-ai-recommendation [statusMessage]="aiStatusMessage" [insights]="aiInsights"></app-ai-recommendation>
    </div>

</div>
