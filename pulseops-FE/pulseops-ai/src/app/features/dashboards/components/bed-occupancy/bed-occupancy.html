<app-dashboard-card>

    <div class="header">

        <div class="title">

            <div class="widget-icon">

                <mat-icon>bed</mat-icon>

            </div>

            <div>

                <h3>Bed Occupancy</h3>

                <span>Live Capacity</span>

            </div>

        </div>

    </div>

    <div class="occupancy-value">

        {{ occupiedBeds }}

        <span>/ {{ totalBeds }}</span>

    </div>

    <div class="percentage">

        {{ occupancyPercentage }}% Occupied

    </div>

    <div class="progress">

        <div class="progress-value" [style.width.%]="occupancyPercentage">

        </div>

    </div>

    <div class="stats">

        <div class="stat">

            <div class="dot success"></div>

            <span>Available</span>

            <strong>{{ availableBeds }}</strong>

        </div>

        <div class="stat">

            <div class="dot primary"></div>

            <span>Occupied</span>

            <strong>{{ occupiedBeds }}</strong>

        </div>

        <div class="stat">

            <div class="dot muted"></div>

            <span>Total Beds</span>

            <strong>{{ totalBeds }}</strong>

        </div>

    </div>

</app-dashboard-card>
