<app-dashboard-card>

    <div class="header">

        <div class="title">

            <div class="widget-icon">

                <mat-icon>auto_awesome</mat-icon>

            </div>

            <div>

                <h3>AI Copilot</h3>

                <span>Preview — coming soon</span>

            </div>

        </div>

    </div>

    <div class="summary">

        {{ statusMessage }}

    </div>

    <div class="section-title">

        Planned Capabilities

    </div>

    <div class="item" *ngFor="let insight of insights">

        <mat-icon>auto_awesome</mat-icon>

        <span><strong>{{ insight.title }}:</strong> {{ insight.description }}</span>

    </div>

    <div class="footer">

        <span>Status</span>

        <strong>Preview</strong>

    </div>

</app-dashboard-card>
