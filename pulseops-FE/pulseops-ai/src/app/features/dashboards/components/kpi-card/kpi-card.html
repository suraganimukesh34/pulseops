<app-dashboard-card>

    <div class="header">

        <div class="icon">

            <mat-icon>{{ card.icon }}</mat-icon> 

        </div>

        <div class="status" [ngClass]="card.color">

        </div>

    </div>

    <div class="body">

        <span class="title">

            {{ card.title }}

        </span>

        <h2>

            {{ card.value }}

        </h2>

    </div>

</app-dashboard-card>
