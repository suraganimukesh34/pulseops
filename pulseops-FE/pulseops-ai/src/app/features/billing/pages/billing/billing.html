<div class="list-page">
    <div class="summary-grid">

        <app-stat-card icon="receipt_long" title="Total Invoices" [value]="invoices.length.toString()"
            subtitle="All patient invoices" color="var(--info)">
        </app-stat-card>

        <app-stat-card icon="payments" title="Pending Amount" [value]="pendingAmountFormatted"
            subtitle="Pending &amp; overdue balance" color="var(--warning)">
        </app-stat-card>

        <app-stat-card icon="error" title="Overdue" [value]="overdueCount.toString()"
            subtitle="Invoices past due" color="var(--danger)">
        </app-stat-card>

    </div>

    <div class="list-table">

        <div class="table-header">
            <div>
                <h2>Invoices</h2>
                <span>{{ invoices.length }} Invoices</span>
            </div>

            <button class="add-btn" type="button" (click)="openAddInvoiceDialog()">
                + Add Invoice
            </button>
        </div>

        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="patient_name">
                <th mat-header-cell *matHeaderCellDef>Patient</th>
                <td mat-cell *matCellDef="let invoice">{{ invoice.patient_name }}</td>
            </ng-container>

            <ng-container matColumnDef="items">
                <th mat-header-cell *matHeaderCellDef>Items</th>
                <td mat-cell *matCellDef="let invoice">{{ itemDescriptions(invoice) }}</td>
            </ng-container>

            <ng-container matColumnDef="total_amount">
                <th mat-header-cell *matHeaderCellDef>Total Amount</th>
                <td mat-cell *matCellDef="let invoice">${{ invoice.total_amount.toLocaleString() }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let invoice">
                    <span class="badge" [ngClass]="badgeClass(invoice.status)">{{ invoice.status }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="due_date">
                <th mat-header-cell *matHeaderCellDef>Due Date</th>
                <td mat-cell *matCellDef="let invoice">{{ invoice.due_date }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let invoice">
                    @if (invoice.status !== 'Paid') {
                    <button type="button" class="submit-button" (click)="markPaid(invoice)">
                        Mark Paid
                    </button>
                    }
                    <button type="button" class="icon-action-btn" aria-label="Edit invoice"
                        (click)="openEditInvoiceDialog(invoice)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button type="button" class="icon-action-btn danger" aria-label="Delete invoice"
                        (click)="deleteInvoice(invoice)">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

    </div>
</div>
