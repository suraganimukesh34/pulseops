<div class="list-page">
    <div class="summary-grid">

        <app-stat-card icon="bed" title="Total Beds" [value]="totalCount.toString()" subtitle="Across the hospital"
            color="var(--info)">
        </app-stat-card>

        <app-stat-card icon="check_circle" title="Available" [value]="availableCount.toString()"
            subtitle="Ready for patients" color="var(--success)">
        </app-stat-card>

        <app-stat-card icon="airline_seat_flat" title="Occupied" [value]="occupiedCount.toString()"
            subtitle="Currently in use" color="var(--danger)">
        </app-stat-card>

    </div>

    <div class="list-table">

        <div class="table-header">
            <div>
                <h2>Beds</h2>
                <span>{{ beds.length }} Beds</span>
            </div>

            <button class="add-btn" type="button" (click)="openAddBedDialog()">
                + Add Bed
            </button>
        </div>

        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="department">
                <th mat-header-cell *matHeaderCellDef>Department</th>
                <td mat-cell *matCellDef="let bed">{{ departmentName(bed.department_id) }}</td>
            </ng-container>

            <ng-container matColumnDef="bed_number">
                <th mat-header-cell *matHeaderCellDef>Bed Number</th>
                <td mat-cell *matCellDef="let bed">{{ bed.bed_number }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let bed">
                    <span class="badge" [ngClass]="badgeClass(bed.status)">{{ bed.status }}</span>
                </td>
            </ng-container>

            <ng-container matColumnDef="patient_id">
                <th mat-header-cell *matHeaderCellDef>Patient ID</th>
                <td mat-cell *matCellDef="let bed">{{ bed.patient_id || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Action</th>
                <td mat-cell *matCellDef="let bed">
                    @if (bed.status === 'Occupied') {
                    <button type="button" class="cancel-button" (click)="releaseBed(bed)">Release</button>
                    } @else if (bed.status === 'Available') {
                    <button type="button" class="submit-button" (click)="openAdmitDialog(bed)">Admit</button>
                    }
                    <button type="button" class="icon-action-btn" aria-label="Edit bed"
                        (click)="openEditBedDialog(bed)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button type="button" class="icon-action-btn danger" aria-label="Delete bed"
                        (click)="deleteBed(bed)">
                        <mat-icon>delete_outline</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

    </div>
</div>
