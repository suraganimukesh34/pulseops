<div class="list-page">
    <div class="summary-grid">

        <app-stat-card icon="badge" title="Total Staff" [value]="totalCount.toString()"
            subtitle="Across the hospital" color="var(--info)">
        </app-stat-card>

        <app-stat-card icon="check_circle" title="On Duty" [value]="onDutyCount.toString()"
            subtitle="Currently working" color="var(--success)">
        </app-stat-card>

        <app-stat-card icon="event_busy" title="On Leave" [value]="onLeaveCount.toString()"
            subtitle="Currently on leave" color="var(--warning)">
        </app-stat-card>

    </div>

    <div class="list-table">

        <div class="table-header">
            <div>
                <h2>Staff</h2>
                <span>{{ staff.length }} Staff Members</span>
            </div>

            <button class="add-btn" type="button" (click)="openAddStaffDialog()">
                + Add Staff
            </button>
        </div>

        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let member">{{ member.name }}</td>
            </ng-container>

            <ng-container matColumnDef="role">
                <th mat-header-cell *matHeaderCellDef>Role</th>
                <td mat-cell *matCellDef="let member">{{ member.role }}</td>
            </ng-container>

            <ng-container matColumnDef="department">
                <th mat-header-cell *matHeaderCellDef>Department</th>
                <td mat-cell *matCellDef="let member">{{ departmentName(member.department_id) }}</td>
            </ng-container>

            <ng-container matColumnDef="specialization">
                <th mat-header-cell *matHeaderCellDef>Specialization</th>
                <td mat-cell *matCellDef="let member">{{ member.specialization || '—' }}</td>
            </ng-container>

            <ng-container matColumnDef="shift">
                <th mat-header-cell *matHeaderCellDef>Shift</th>
                <td mat-cell *matCellDef="let member">{{ member.shift }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let member">
                    <span class="badge" [ngClass]="badgeClass(member.status)">{{ member.status }}</span>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

    </div>
</div>
