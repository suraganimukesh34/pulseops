<div class="patients-container">
    <div class="summary-grid">

        <app-stat-card icon="groups" title="Total Patients" [value]="patients.length.toString()"
            subtitle="Currently Admitted" color="var(--info)">
        </app-stat-card>

        <app-stat-card icon="favorite" title="Critical"
            [value]="patients.filter(p=>p.status==='Critical').length.toString()" subtitle="Need Immediate Care"
            color="var(--danger)">
        </app-stat-card>

        <app-stat-card icon="schedule" title="Waiting"
            [value]="patients.filter(p=>p.status==='Waiting').length.toString()" subtitle="Awaiting Treatment"
            color="var(--warning)">
        </app-stat-card>

        <app-stat-card icon="logout" title="Stable" [value]="patients.filter(p=>p.status==='Stable').length.toString()"
            subtitle="Recovering" color="var(--success)">
        </app-stat-card>

    </div>

    <div class="patient-table">

        <div class="table-header">

            <h2>Patient List</h2>

            <span>{{ patientsCount }} Patients</span>

        </div>

        <table mat-table [dataSource]="dataSource">

            <!-- Patient ID -->
            <ng-container matColumnDef="id">

                <th mat-header-cell *matHeaderCellDef>
                    ID
                </th>

                <td mat-cell *matCellDef="let patient">
                    {{patient.id}}
                </td>

            </ng-container>

            <!-- Name -->

            <ng-container matColumnDef="name">

                <th mat-header-cell *matHeaderCellDef>

                    Name

                </th>

                <td mat-cell *matCellDef="let patient">

                    {{patient.name}}

                </td>

            </ng-container>

            <!-- Department -->

            <ng-container matColumnDef="department">

                <th mat-header-cell *matHeaderCellDef>

                    Department

                </th>

                <td mat-cell *matCellDef="let patient">

                    {{patient.department}}

                </td>

            </ng-container>

            <!-- Ward -->

            <ng-container matColumnDef="ward">

                <th mat-header-cell *matHeaderCellDef>

                    Ward

                </th>

                <td mat-cell *matCellDef="let patient">

                    {{patient.ward}}

                </td>

            </ng-container>

            <!-- Bed -->

            <ng-container matColumnDef="bed">

                <th mat-header-cell *matHeaderCellDef>

                    Bed

                </th>

                <td mat-cell *matCellDef="let patient">

                    {{patient.bed}}

                </td>

            </ng-container>

            <!-- Status -->

            <ng-container matColumnDef="status">

                <th mat-header-cell *matHeaderCellDef>

                    Status

                </th>

                <td mat-cell *matCellDef="let patient">

                    <span class="status-chip">

                        {{patient.status}}

                    </span>

                </td>

            </ng-container>

            <!-- Priority -->

            <ng-container matColumnDef="priority">

                <th mat-header-cell *matHeaderCellDef>

                    Priority

                </th>

                <td mat-cell *matCellDef="let patient">

                    {{patient.priority}}

                </td>

            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>



    </div>
</div>
