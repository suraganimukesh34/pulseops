<div class="stat-card">

    <div class="card-header">

        <div class="icon-container" [style.background]="color + '20'" [style.borderColor]="color + '40'">

            <mat-icon [style.color]="color">

                {{ icon }}

            </mat-icon>

        </div>

    </div>

    <div class="card-title">

        {{ title }}

    </div>

    <div class="card-value">

        {{ value }}

    </div>

    <div class="card-subtitle">

        {{ subtitle }}

    </div>

</div>
