<div class="form-dialog confirm-dialog">

    <header class="dialog-header">
        <div class="header-content">
            <div class="header-icon" [class.danger]="data.danger">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M12 9v4M12 17h.01M10.3 3.8 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </div>

            <div>
                <h2>{{ data.title }}</h2>
            </div>
        </div>

        <button type="button" class="close-button" aria-label="Close dialog" (click)="cancel()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
        </button>
    </header>

    <div class="confirm-body">
        <p>{{ data.message }}</p>
    </div>

    <footer class="dialog-footer">
        <button type="button" class="cancel-button" (click)="cancel()">
            {{ data.cancelLabel || 'Cancel' }}
        </button>

        <button type="button" class="submit-button" [class.danger-button]="data.danger" (click)="confirm()">
            {{ data.confirmLabel || 'Confirm' }}
        </button>
    </footer>

</div>
